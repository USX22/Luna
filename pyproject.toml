[project]
name = "ia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
luna = "ia.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
