[project]
name = "ia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
luna = "ia.cli:main"
luna-explora = "ia.cli:explore_main"
luna-reflexiona = "ia.cli:reflect_main"
luna-voz = "ia.cli:voice_main"
luna-alto = "ia.cli:stop_main"
luna-respaldo = "ia.cli:backup_main"

[project.optional-dependencies]
dev = ["pytest"]
voz = ["faster-whisper", "sounddevice", "pyttsx3"]
mundo = ["torch"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
